<!DOCTYPE html> 
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Validar formulario</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <form id="formulario" onsubmit="return validarContrasena()">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Nombre" required>
            <label for="correo">Correo electrónico</label>
            <input type="email" placeholder="Correo electrónico" id="correo" required>
            <label for="contrasena">Contraseña:</label>
            <input type="password" placeholder="Contraseña" id="contrasena" required>
            <label for="confirmar">Confirmar contraseña:</label>
            <input type="password" placeholder="Confirmar contraseña" id="confirmar" required>
            <input type="submit" id="subir">
        </form>
        <script src="validacion.js"></script>
    </body>

</html>
